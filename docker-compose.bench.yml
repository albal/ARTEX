# The ARTEX Tencent TSec Benchmark evaluation image — one-command local build + run.
# Independent of the production docker-compose.yml (multi-service: artex+postgres).
# Usage:
#   cp bench/.env.example bench/.env   # fill in LLM_API_KEY / BENCHMARK_TOKEN etc.
#   docker compose -f docker-compose.bench.yml up --build      # build and run in the foreground (watch the logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # in the background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # stop (add -v to delete the data volume too)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # share the network with the physical machine: the container uses the host network stack directly and can reach target networks on the host/VPN.
    # in host mode there is no ports mapping; the container binds the host ports directly: 8787 (UI/API), 8788 (proxy),
    # and the internal PostgreSQL 5432 — ensure these three host ports are free (stop anything using them before testing locally).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
